<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading and list</title>
</head>
<body>
    <h1>heading</h1>
    <h2>heading</h2>
    <h3>heading</h3>
    <h4>heading</h4>
    <h5>heading</h5>
    <h6>heading</h6>

    <ul>
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
    </ul>

    <ol>
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
    </ol>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLzOsXAGnBHRlP3m5OClYHGLxQHkqyJQGVI3Vxk3d6aA&s" alt="">

    <!-- block level -- takes the entire width
    inline -- only takes that much width which is needed -->

    <div>
        <h2>Block level elements</h2>
        <p>takes the entire with </p>
        <ul>
            <li>ol, ul</li>
            <li>div</li>
            <li>heading</li>
        </ul>
    </div>

    <div>
        <h2>Inline elements</h2>
        <p>take only that much width which is needed</p>
        <ul>
            <li>span</li>
            <li>image</li>
            <li>anchor tag</li>
        </ul>
    </div>
</body>
</html>
