<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../../../src/output.css" rel="stylesheet">
    <title>Login page</title>
</head>

<body class="bg-gray-800 flex justify-center items-center min-h-screen">
    <div class="bg-gray-600 rounded-lg p-8 shadow-2xl max-w-sm w-full ">
        <h2 class="text-center text-3xl text-white mb-6 font-bold">Login</h2>
        <form>
            <div class="mb-4 ">
                <label class="block text-sm font-medium text-white m-2" for="">email</label>
                <input class="w-full px-3 py-2 bg-gray-300 border-none rounded-sm text-black focus:outline-none focus:ring-1 focus:ring-blue-200" type="email" placeholder="email">
            </div>
            <div>
                <label class="block text-sm font-medium text-white m-2"  for="">password</label>
                <input class="w-full px-3 py-2 bg-gray-300 border-none rounded-sm text-black focus:outline-none focus:ring-1 focus:ring-blue-200"  type="password" placeholder="password">
            </div>
            <button class="w-full bg-blue-600 mt-6 p-3 rounded-sm hover:bg-blue-800
            border-none shadow-lg" type="submit">login</button>
        </form>
    </div>
</body>

</html>
