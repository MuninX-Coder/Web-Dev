<script>
    // ajex request past mai use hotai api requestion
    // kuch status code hotai iskok dhekan hotai online mai hai
    const requestUrl = "https://api.github.com/users/hiteshchoudhary"
    const xhr = new XMLHttpRequest();
    xhr.open("GET", requestUrl) // ek method , and url letai
    xhr.onreadystatechange = function(){ // state change tho har bar run hotai
    
        console.log(xhr.readyState)
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText);


            console.log(data.followers)
        }
    }
    xhr.send() // call karna hotai

</script>

</html>
