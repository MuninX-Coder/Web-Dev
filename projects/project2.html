<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
      padding: 20px;
    }

    /* Calculator Card */
    .calculator-card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
    }

    .calculator-card h1 {
      font-size: 1.6rem;
      color: #1a202c;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      text-align: center;
      margin-bottom: 24px;
    }

    /* Form Fields */
    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: #4c51bf;
    }

    /* Action Button */
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #4c51bf;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    .btn:hover {
      background-color: #434190;
    }

    /* Result Display */
    .result-container {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #edf2f7;
      text-align: center;
    }

    .result-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #718096;
      margin-bottom: 6px;
    }

    .bmi-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #2d3748;
      line-height: 1.1;
    }

    .bmi-status {
      font-size: 1rem;
      font-weight: 600;
      color: #4c51bf;
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <div class="calculator-card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Enter your details below to calculate your Body Mass Index.</p>

    <!-- Form Inputs -->
    <div class="input-group">
      <label for="weight">Weight (kg)</label>
      <input type="number" id="weightInp" placeholder="e.g. 70">
    </div>

    <div class="input-group">
      <label for="height">Height (cm)</label>
      <input type="number" id="heightInp" placeholder="e.g. 175">
    </div>

    <button id="calculate-btn" class="btn">Calculate BMI</button>

    <!-- Results Display -->
    <div class="result-container">
      <p class="result-title">Your Result</p>
      <div id="bmi-value" class="bmi-value">--</div>
      <div id="bmi-status" class="bmi-status">Enter values to start</div>
    </div>
  </div>


</body>
<script>
  const weightInp = document.querySelector("#weightInp");
  const heightInp = document.querySelector("#heightInp");
  const button = document.querySelector("button");
  const resultTitle = document.querySelector(".result-title");
  const bmiValue = document.querySelector("#bmi-value");
  const bmiStatus = document.querySelector("#bmi-status")

  button.addEventListener("click", function () {
    const weightInpVal = weightInp.value;
    const heightInpVal = heightInp.value;

    if (heightInpVal === "" || heightInpVal < 0 || isNaN(heightInpVal)) {
      resultTitle.textContent = "please give a valid height"
    } else if (weightInpVal === "" || weightInpVal < 0 || isNaN(weightInpVal)) {
      resultTitle.textContent = "please give a valid weight"
    } else {
      const bmi = (weightInpVal / ((heightInpVal * heightInpVal) / 10000)).toFixed(2)
      resultTitle.textContent = bmi;
      if (bmi < 18.6) {
        bmiStatus.textContent = `Under weight = less than 18.6`
      } else if (bmi >= 18.6 && bmi <= 24.9) {
        bmiStatus.textContent = `Normal range = 18.6 and 24.9`
      } else {
        bmiStatus.textContent = `Over weight = Greater than 24.9`
      }
    } 

  })

</script>

</html>
