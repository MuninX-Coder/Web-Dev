<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <style>
        /* Modern Clean Font Import */
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Paper texture background */
            background-color: #f7f6f2;
            background-image: 
                radial-gradient(at 0% 0%, rgba(220, 215, 205, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(210, 205, 195, 0.4) 0px, transparent 50%);
            color: #1d1d1f;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        /* Apple Glassmorphism Card Container */
        .game-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.04),
                0 1px 3px rgba(0, 0, 0, 0.02),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        /* Heading */
        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #1d1d1f;
            margin-bottom: 10px;
        }

        /* Paragraph Instructions */
        .description {
            font-size: 0.95rem;
            color: #6e6e73;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .attempts-info {
            font-size: 0.85rem;
            font-weight: 500;
            color: #86868b;
            background: rgba(0, 0, 0, 0.03);
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 28px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Form Controls */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            color: #1d1d1f;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        input[type="number"]:focus {
            border-color: #0071e3;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        /* Hide Number Input Spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Submit Button */
        .submit-btn {
            background-color: #0071e3;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
            padding: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        .submit-btn:hover {
            background-color: #0077ed;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 113, 227, 0.32);
        }

        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.2);
        }

        /* Game Stats Dashboard */
        .stats-board {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .stat-label {
            color: #6e6e73;
            font-weight: 400;
        }

        .stat-value {
            font-weight: 600;
            color: #1d1d1f;
        }

        .previous-guesses {
            letter-spacing: 1px;
            color: #0071e3;
        }

        /* Feedback Message */
        .feedback {
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1d1d1f;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <main class="game-card">
        <h1>Guess the Number</h1>
        <p class="description">Try to guess a random number between 1 and 100.</p>
        <p class="attempts-info">You have 10 attempts to guess the correct number.</p>

        <form class="input-group">
            <input type="number" id="guessField" min="1" max="100" placeholder="Enter your guess">
            <button type="submit" id="subtn" class="submit-btn">Submit Guess</button>
        </form>

        <div class="stats-board">
            <div class="stat-item">
                <span class="stat-label">Previous Guesses:</span>
                <!-- Corrected class selector target -->
                <span class="stat-value previous-guesses">None</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Guesses Remaining:</span>
                <!-- Added dedicated ID so querySelector doesn't get confused -->
                <span class="stat-value" id="remaining">10</span>
            </div>
        </div>

        <p class="feedback"></p>
    </main>

    <script>
        // 1. Math.random() 0-1 (decimal) deta hai. * 100 + 1 se number 1 se 100 tak ka banta hai. parseInt se decimal hat jata hai.
        let randomNumber = parseInt(Math.random() * 100 + 1);

        // 2. HTML Elements ko JavaScript variables mein store kar rahe hain taaki unhe modify kar sakein.
        const input = document.querySelector("#guessField");
        const button = document.querySelector("#subtn");
        const guessRemaining = document.querySelector("#remaining");
        const previousGuess = document.querySelector(".previous-guesses");
        const feedback = document.querySelector(".feedback");

        // 3. Game State variables: purane guesses ko array me rakhne ke liye aur attempts count karne ke liye.
        let prevGuess = [];
        let attempt = 1;      // Current attempt number
        let playGame = true;  // Flag: Game abhi chal raha hai ya khatam ho gaya hai

        // 4. Main Event Listener: Jab user button click karega tab ye code chalega.
        if (playGame) {
            button.addEventListener("click", function (e) {
                // e.preventDefault() form submit hone par page reload hone se rokta hai.
                e.preventDefault();

                // User ke input box ka text integer/number mein badal kar le rahe hain.
                const inputVal = parseInt(input.value);

                // Guess ko check aur validate karne ke liye agle function ko call kar rahe hain.
                validateGuess(inputVal);
            });
        }

        // 5. Function: Validate Guess (Ye check karega ki input valid number hai ya nahi)
        function validateGuess(guess) {
            if (isNaN(guess)) {
                alert("Please enter a valid number");
            } else if (guess < 1) {
                alert("Please enter a number more than 1");
            } else if (guess > 100) {
                alert("Please enter a number less than 100");
            } else {
                // Agar number sahi range mein hai, to usko array mein daal do.
                prevGuess.push(guess);

                // Agar attempt 10 poore ho chuke hain (i.e., ab 11th attempt hone ja raha tha):
                if (attempt === 10) {
                    displayGuess(guess); // UI par guess aur remaining count update karo
                    displayMessage(`Game Over! Random number was ${randomNumber}`); // Loss message dikhao
                    endGame(); // Game freeze kar do
                } else {
                    displayGuess(guess); // UI par update karo
                    checkGuess(guess);   // Check karo number chhota hai, bada hai ya sahi hai
                }
            }
        }

        // 6. Function: Check Guess (Ye secret number se compare karega ki guess sahi hai, high hai, ya low)
        function checkGuess(guess) {
            if (guess === randomNumber) {
                displayMessage(`🎉 You guessed it right! The number was ${randomNumber}`);
                endGame();
            } else if (guess < randomNumber) {
                displayMessage(`📉 Your guess is TOO low!`);
            } else if (guess > randomNumber) {
                displayMessage(`📈 Your guess is TOO high!`);
            }
        }

        // 7. Function: Display Message (Ye feedback paragraph text change karta hai)
        function displayMessage(message) {
            feedback.textContent = message;
        }

        // 8. Function: Display Guess (Ye input clear karta hai, history aur remaining count dikhata hai)
        function displayGuess(guess) {
            input.value = ""; // Input box khali kar do agle guess ke liye

            // Pehli baar 'None' ko hata kar pehla guess likho, baad me commas se add karo
            if (attempt === 1) {
                previousGuess.textContent = `${guess}`;
            } else {
                previousGuess.textContent += `, ${guess}`;
            }

            attempt++; // Next attempt increment
            guessRemaining.textContent = `${11 - attempt}`; // Remaining count decrease
        }

        // 9. Function: End Game (Game khatam hone par input/button disable karta hai aur new game option deta hai)
        function endGame() {
            input.value = "";
            input.setAttribute("disabled", ""); // Input box block
            button.setAttribute("disabled", ""); // Submit button block
            button.style.opacity = "0.5";
            button.style.cursor = "not-allowed";

            // Restart Button create kar ke UI par add kar rahe hain
            const restartBtn = document.createElement("button");
            restartBtn.textContent = "Start New Game";
            restartBtn.className = "submit-btn";
            restartBtn.style.marginTop = "15px";
            restartBtn.style.backgroundColor = "#34c759"; // Apple Green color

            document.querySelector(".game-card").appendChild(restartBtn);

            playGame = false;
            
            // New game button ka listener
            restartBtn.addEventListener("click", function () {
                newGame(restartBtn);
            });
        }

        // 10. Function: New Game (Game ko wapas reset kar ke initial state me laata hai)
        function newGame(restartBtn) {
            // Naya secret random number generate karo
            randomNumber = parseInt(Math.random() * 100 + 1);

            // Sare tracking variables clear karo
            prevGuess = [];
            attempt = 1;

            // UI Elements ko reset karo
            previousGuess.textContent = "None";
            guessRemaining.textContent = "10";
            feedback.textContent = "";

            // Inputs ko wapas enable karo
            input.removeAttribute("disabled");
            button.removeAttribute("disabled");
            button.style.opacity = "1";
            button.style.cursor = "pointer";

            // Restart button ko DOM se remove kar do
            restartBtn.remove();

            playGame = true;
        }
    </script>
</body>
</html>
