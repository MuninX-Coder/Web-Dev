<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Break point - mobile responsive</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
        }

        .responsive {
            width: 100%;
            max-width: 1200px;
            color: white;
            padding: 20px;
            font-size: 24px;
            background-color: rgb(156, 27, 162);
            text-align: center;
        }

        @media (max-width: 600px) {
            .responsive {
                background-color: rgb(66, 66, 144);

            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
.responsive{
    background-color: rgb(67, 134, 67);
}
        }
    </style>
</head>

<body>
    <div class="responsive">
        this div changes color based on the screen size
    </div>
</body>

</html>
