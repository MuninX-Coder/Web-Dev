<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        .navContainer {
            margin-bottom: 40px;

        }

        h2 {
            margin-bottom: 10px;
        }

        .nav1 {
            background-color: #383b3f;
            padding: 10px;
        }

        .nav1 ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-around;
        }

        .nav1 li {
            display: inline;
        }

        .nav1 a {
            text-decoration: none;
            color: white;
            padding: 5px 10px;
            border-radius: 9px;
            position: relative;
        }

        .nav1 .loginBtn {
            background-color: rgb(55, 55, 205);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 9px;
            cursor: pointer;
        }

        .nav1 a::after {
            content: "";
            position: absolute;
            height: 2px;
            width: 100%;
            bottom: 0;
            left: 0;
            background-color: rgb(126, 126, 185);
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;

        }

        .nav1 a:hover::after {
            transform: scaleX(1);
        }

        .nav2 {
            background-color: rgb(37, 77, 44);
            width: 200px;
            padding: 20px;


        }

        .nav2 ul {
            list-style-type: none;
            margin: 0;
            padding: 0;

        }

        .nav2 li {
            margin-bottom: 9px;
        }

        .nav2 a {
            text-decoration: none;
            color: white;
            display: block;
            padding: 10px;
            width: 100%;
        }

        .nav2 a:hover {
            background-color: rgb(9, 69, 9);
        }

        .nav2 .loginBtn {
            background-color: rgb(16, 52, 15);
            color: #fff;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 2px;
            cursor: pointer;

        }

        .nav2 .loginBtn:hover {
            background-color: rgb(30, 89, 30);
            border: 0.1px solid white;
        }

        .nav3 {
            background-color: rgb(128, 68, 171);
            padding: 10px;

        }

        .nav3 ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav3 a {
            text-decoration: none;
            color: #fff;
            padding: 10px;
            display: block;
        }

        .nav3 .dropdownContent {
            display: none;

        }
        .nav3 .dropDown:hover .dropdownContent {
            display: block;
            position: absolute;
          background-color: rgb(87, 46, 87);
          min-width: 100px;

        }


        .nav3 .loginBtn {
            background-color: purple;
            padding: 10px 15px;
            border-radius: 2px;
            border: none;
            color: white;
        }
    </style>
</head>

<body>
    <div class="navContainer">
        <h2>variation 1: Horizontal with undelrine effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="loginBtn">Login</button></li>
            </ul>
        </nav>
    </div>

    <div class="navContainer">
        <h2>variation 2: Vertical with hover effects</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Procuts</a></li>
            </ul>
            <button class="loginBtn">Login</button>
        </nav>
    </div>

    <div class="navContainer">
        <h2>Variation 3: Horizontal with dropdown</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="dropDown">
                    <a href="#">About</a>
                    <div class="dropdownContent">
                        <a href="#">Our story</a>
                        <a href="#">Team</a>
                        <a href="#">Contact</a>
                    </div>
                </li>
                <li><a href="#">Products</a></li>
                <li><button class="loginBtn">Login </button></li>
            </ul>
        </nav>
    </div>
</body>

</html>
